# Podman containers configuration
# Installed by podman-ubuntu to ${INSTALL_PREFIX}/etc/containers/containers.conf
# (the __PREFIX__ token is substituted with INSTALL_PREFIX at install time)
# See: man containers.conf(5)

[containers]

# Default seccomp profile for container runtime security
seccomp_profile = "__PREFIX__/share/containers/seccomp.json"

[engine]

# Default OCI runtime - crun is faster and uses less memory than runc
runtime = "crun"

# Search paths for helper binaries (netavark, aardvark-dns, passt, conmon, crun).
# Resolved relative to the install prefix so this tree is fully self-contained
# and never consults Ubuntu's /usr/bin or /usr/lib/podman.
helper_binaries_dir = [
    "__PREFIX__/bin",
    "__PREFIX__/libexec/podman"
]

# Explicit conmon path (next to podman in bin/).
conmon_path = [
    "__PREFIX__/bin/conmon"
]

# Explicit runtime binary (deterministic; avoids PATH resolving to /usr/bin/crun).
[engine.runtimes]
crun = ["__PREFIX__/bin/crun"]

[network]

# Network backend - netavark is the modern replacement for CNI
network_backend = "netavark"
